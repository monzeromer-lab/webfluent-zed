id = "webfluent"
name = "WebFluent"
description = "WebFluent language support for .wf and .wfx files: syntax highlighting, outline, bracket matching, auto-indent, snippets, and the wf-lsp language server (diagnostics, completions, hover, go to definition, code actions)."
version = "3.2.0"
schema_version = 1
authors = ["Monzer Omer <monzer.a.omer@gmail.com>"]
repository = "https://github.com/monzeromer-lab/webfluent-zed"
snippets = ["snippets/webfluent.json"]

# The grammars live in their own repository, tree-sitter-webfluent. Zed
# clones it at `rev` and compiles `path/src/parser.c`, so `rev` must be a
# commit that already contains the grammar you want: bump it after a grammar
# change lands there.
[grammars.webfluent]
repository = "https://github.com/monzeromer-lab/tree-sitter-webfluent"
rev = "ba124f0e6280b069b235ff4521d8b23925692180"
path = "webfluent"

# The indented layout, `.wfx`: the same grammar generated with its layout
# tokens on, from the same commit.
[grammars.webfluentx]
repository = "https://github.com/monzeromer-lab/tree-sitter-webfluent"
rev = "ba124f0e6280b069b235ff4521d8b23925692180"
path = "webfluentx"

[language_servers.wf-lsp]
name = "WebFluent Language Server"
languages = ["WebFluent", "WebFluent (indented)"]
code_action_kinds = ["quickfix"]
