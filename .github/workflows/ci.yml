name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The crate Zed compiles to WebAssembly. Whether the queries compile
  # against the pinned grammar and the vocabularies agree with the compiler
  # is checked in the WebFluent repository, which links this one, the
  # grammar and the compiler together (`just zed-check`).
  crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt -- --check
      - run: cargo build --target wasm32-wasip2
      - run: cargo clippy --target wasm32-wasip2 -- -D warnings
      # The checksum check and the settings rules, on the host.
      - run: cargo test
